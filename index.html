<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Logic progression ayno — онлайн-курс логического мышления</title>
    <meta
      name="description"
      content="Онлайн-курс логического мышления: больше 600 задач на 5 уровнях сложности, теория, пошаговые разборы, тест уровня и отслеживание прогресса."
    />
    <meta property="og:title" content="Logic progression ayno" />
    <meta property="og:description" content="Онлайн-курс логического мышления: 600+ задач, 13 тем, 5 уровней сложности." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F8F7FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0B14" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('logic-progression-ayno')
          var theme = raw ? JSON.parse(raw).state.settings.theme : 'system'
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
